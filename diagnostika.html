<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LazyMapper • Diagnostika e serverëve</title><style>*{box-sizing:border-box}body{margin:0;background:#031323;color:#fff;font:15px Arial;padding:15px}.wrap{max-width:960px;margin:auto}.card{background:#08243b;border:1px solid #28648e;border-radius:18px;padding:16px;margin:12px 0}button,input,select{background:#071a2b;border:1px solid #356b91;border-radius:12px;color:#fff;padding:12px}button{cursor:pointer}button.primary{background:#eab91e;color:#071523;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}.result{border-bottom:1px solid #356b91;padding:9px 0;white-space:pre-wrap}.ok{color:#9effb4}.bad{color:#ff9b9b}.muted{color:#a6bfd1}</style></head><body><main class="wrap"><div class="card"><a style="color:#eab91e" href="./ballina.html">← Ballina</a><h1>🛠 Diagnostika LIVE</h1><p class="muted">Kontrollon vetëm përgjigjen e API-së listJsonp për 20 serverët dhe 4 llojet. Nuk provon luajtjen reale dhe nuk ndryshon të dhëna.</p><div class="grid"><select id="kind"><option>LIVE</option><option>24_7</option><option>VOD</option><option>SERIES</option></select><button id="one" class="primary">Testo serverin</button><button id="all">Testo 20 serverët</button><button id="stop">Ndalo</button></div><div class="grid" style="margin-top:9px"><select id="server"></select><button id="download">Eksporto raportin JSON</button></div><p id="status" role="status">Gati.</p></div><div id="results" class="card"></div></main><script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbysBEFikuB_VIK0yIKXZ1-hiRL2P9mZIchLcP0_T4g-9xj1p5HJOkVborf6AD2HBP66/exec';
const $=id=>document.getElementById(id);let run=0,report=[];
for(let i=1;i<=20;i++){const id='SERVER_'+String(i).padStart(2,'0');$('server').add(new Option(id,id))}
function request(server,type,token){return new Promise(resolve=>{const start=performance.now(),cb='lm_diag_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');let settled=false;const finish=(state,details={})=>{if(settled)return;settled=true;clearTimeout(timer);delete window[cb];script.remove();resolve({server,type,state,ms:Math.round(performance.now()-start),...details})};const timer=setTimeout(()=>finish('TIMEOUT',{message:'API nuk u përgjigj brenda 15 sekondave'}),15000);window[cb]=data=>{if(token!==run)return finish('CANCELLED');if(data?.ok===true&&Array.isArray(data.items))finish('API_OK',{total:Number(data.total??data.items.length),sampleCount:data.items.length});else finish('API_ERROR',{message:String(data?.error||'Përgjigje e papritur')})};script.onerror=()=>finish('NETWORK_ERROR',{message:'JSONP script nuk u ngarkua'});script.src=API+'?action=listJsonp&serverId='+encodeURIComponent(server)+'&type='+encodeURIComponent(type)+'&offset=0&limit=1&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.append(script)})}
function show(item){const d=document.createElement('div');d.className='result '+(item.state==='API_OK'?'ok':'bad');d.textContent=item.server+' • '+item.type+' • '+item.state+' • '+item.ms+'ms'+(item.total!=null?' • total='+item.total:'')+(item.message?' • '+item.message:'');$('results').append(d)}
async function test(all){const token=++run;report=[];$('results').replaceChildren();const ids=all?Array.from({length:20},(_,i)=>'SERVER_'+String(i+1).padStart(2,'0')):[$('server').value];$('one').disabled=$('all').disabled=true;for(const id of ids){if(token!==run)break;$('status').textContent='Po testohet '+id+' ('+(report.length+1)+'/'+ids.length+')';const result=await request(id,$('kind').value,token);if(token!==run)break;report.push(result);show(result)}if(token===run)$('status').textContent='Përfundoi: '+report.filter(x=>x.state==='API_OK').length+'/'+report.length+' API_OK. Kjo nuk vërteton stream-et.';$('one').disabled=$('all').disabled=false}
$('one').onclick=()=>test(false);$('all').onclick=()=>test(true);$('stop').onclick=()=>{run++;$('status').textContent='Testimi u ndal.';$('one').disabled=$('all').disabled=false};
$('download').onclick=()=>{const blob=new Blob([JSON.stringify({generatedAt:new Date().toISOString(),checks:report},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lazymapper-api-diagnostics.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
