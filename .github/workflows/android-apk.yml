name: Build LazyMapper Admin APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_m3u.cjs
      - run: node tests/test_country_repair.cjs
      - run: node tests/test_background_config.cjs
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LazyMapper-UI-checks
          path: ui-checks/
          if-no-files-found: ignore
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy current LazyMapper UI into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cp ballina.html server.html diagnostika.html app/src/main/assets/
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LazyMapper-Admin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
