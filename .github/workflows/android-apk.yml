name: Build LazyMapper Admin APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy current LazyMapper UI into Android assets
        run: mkdir -p app/src/main/assets && cp index.html app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LazyMapper-Admin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
